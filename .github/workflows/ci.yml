name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (without the OCR stack)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" opencv-python-headless
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -W error::ResourceWarning -m unittest
      - name: No private data in the repository
        run: scripts/check-private-data.sh
